name: CI

# 本仓最小门禁（ADR-D29 R2「单仓可自证」）：格式 + 构建 + 静态检查 + 测试。
# 本仓**不得** checkout 其他仓 —— 需要别的仓源码才能过，就是边界画错了。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: gofmt（未格式化即红）
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化，请跑 gofmt -w："
            echo "$out"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # X-DEP-BUMP-CONSUMERS：依赖漏洞门（2026-11-12 回补）。
      # BROKER-DEP-BUMP 首轮只跑了本地 govulncheck、没进 CI 门——依赖升级与
      # 漏洞检测拆开，pin 里带已知漏洞也能全绿。本步把它变成机械判据。
      # 破坏验证：把 pgx 降回 v5.7.3 ⇒ 本步以 GO-2026-5004 报红；还原 ⇒ EXIT=0。
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test
        run: go test ./... -count=1
