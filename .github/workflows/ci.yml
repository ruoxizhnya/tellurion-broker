name: CI

# 本仓最小门禁（ADR-D29 R2「单仓可自证」）：格式 + 构建 + 静态检查 + 测试。
# 本仓**不得** checkout 其他仓 —— 需要别的仓源码才能过，就是边界画错了。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Build & Test
    runs-on: ubuntu-latest
    # BROKER-CI-GATES：库侧用例不再长期 skip——起真 PG，Test 全腿带 DSN 跑。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tellurion_broker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BROKER_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/tellurion_broker_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: gofmt（未格式化即红）
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化，请跑 gofmt -w："
            echo "$out"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # X-DEP-BUMP-CONSUMERS：依赖漏洞门（2026-11-12 回补）。
      # BROKER-DEP-BUMP 首轮只跑了本地 govulncheck、没进 CI 门——依赖升级与
      # 漏洞检测拆开，pin 里带已知漏洞也能全绿。本步把它变成机械判据。
      # 破坏验证：把 pgx 降回 v5.7.3 ⇒ 本步以 GO-2026-5004 报红；还原 ⇒ EXIT=0。
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # BROKER-CI-GATES：Test 前应用本仓迁移。合法入口只有 internal/ackstore 的
      # Migrate（ddl.go 是 broker schema 唯一建表真相，幂等只前滚）；服务启动
      # （cmd/brokergateway 的 connectAndMigrate）与真库用例走同一函数。
      # 这里复用现成的迁移幂等用例，不手写 SQL、不复制 core 脚本。
      - name: Migrate（ackstore.Migrate）
        run: go test ./internal/ackstore -run '^TestPgStore_MigrateIsIdempotent$' -count=1 -v

      - name: Test
        run: go test ./... -count=1 -coverprofile=coverage.out

      # BROKER-CI-GATES：覆盖率门。阈值来源见 AGENTS.md §2：2026-11-13 隔离
      # PG 16 真跑全套件实测 78.0%，取整 78 − 5 = 73。
      - name: Coverage gate
        run: |
          total="$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}' | tr -d '%')"
          echo "total coverage: ${total}% (floor: 73%)"
          if [ -z "$total" ]; then
            echo "coverage total not parsed from coverage.out"
            exit 1
          fi
          awk -v total="$total" 'BEGIN { if (total + 0 < 73) { printf "coverage %.1f%% is below the 73%% floor\n", total; exit 1 } }'

      - name: Test（-race，数据竞争即红）
        run: go test -race ./... -count=1

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
